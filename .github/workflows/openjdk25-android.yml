name: OpenJDK 25 Android ARM64 (manual)
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Digite COMPILAR após revisar recursos, licenças e publicação dos arquivos permitidos'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: openjdk25-android
  cancel-in-progress: false
jobs:
  build:
    # Apenas runner padrão em repositório público; não consome minutos privados.
    if: github.event.inputs.authorization == 'COMPILAR' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: tools/openjdk25
      - name: Verificar recursos antes de instalar ou baixar dependências
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          free -h
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -ge 23622320128
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge 12582912
          test "$(nproc)" -ge 4
      - name: Dependências somente na VM efêmera
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf build-essential clang cmake ninja-build python3 unzip zip xz-utils systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev
      - name: Compilar e verificar runtime
        run: python3 tools/openjdk25/build_ci.py "$RUNNER_TEMP/openmc-jdk25"
      - name: Artefato e fontes correspondentes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openmc-jdk25-android-arm64
          path: ${{ runner.temp }}/openmc-jdk25/dist/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openmc-jdk25-failure-logs
          path: ${{ runner.temp }}/openmc-jdk25/*.log
          if-no-files-found: ignore
          retention-days: 3
